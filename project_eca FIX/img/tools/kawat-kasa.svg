<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b192e"/><stop offset="100%" stop-color="#030b17"/>
    </linearGradient>
    <pattern id="mesh" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M 0 0 L 12 12 M 12 0 L 0 12" stroke="#94a3b8" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg)"/>
  <ellipse cx="200" cy="255" rx="130" ry="18" fill="#000" opacity="0.5"/>

  <!-- Metal Mesh Wire Gauze Screen (Perspective tilt) -->
  <g transform="translate(200, 150) rotate(-15)">
    <rect x="-110" y="-80" width="220" height="160" rx="6" fill="url(#mesh)" stroke="#cbd5e1" stroke-width="4"/>
    <!-- Ceramic Asbestos Center Disc (White circle for heat diffusion) -->
    <ellipse cx="0" cy="0" rx="55" ry="55" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="48" ry="48" fill="#e2e8f0" opacity="0.5"/>
  </g>

  <rect x="15" y="15" width="120" height="26" rx="6" fill="#0284c7" opacity="0.25"/>
  <text x="25" y="32" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">KAWAT KASA</text>
</svg>