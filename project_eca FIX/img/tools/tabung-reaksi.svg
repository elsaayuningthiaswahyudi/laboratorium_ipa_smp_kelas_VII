<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b192e"/><stop offset="100%" stop-color="#030b17"/>
    </linearGradient>
    <linearGradient id="wood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/><stop offset="50%" stop-color="#d97706"/><stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.5"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg)"/>
  <ellipse cx="200" cy="270" rx="150" ry="16" fill="#000" opacity="0.5"/>

  <!-- Wooden Rack Back Bar -->
  <rect x="50" y="240" width="300" height="18" rx="4" fill="url(#wood)" stroke="#f59e0b" stroke-width="1.2"/>
  <rect x="50" y="125" width="300" height="16" rx="4" fill="url(#wood)" stroke="#f59e0b" stroke-width="1.2"/>
  <!-- Side Supports -->
  <rect x="50" y="125" width="18" height="133" rx="3" fill="url(#wood)"/>
  <rect x="332" y="125" width="18" height="133" rx="3" fill="url(#wood)"/>

  <!-- Tube 1 (Red Chemical) -->
  <g transform="translate(90, 45)">
    <rect x="0" y="110" width="28" height="75" fill="#ef4444" opacity="0.85"/>
    <path d="M 0,185 A 14 14 0 0 0 28 185 Z" fill="#ef4444" opacity="0.85"/>
    <rect x="0" y="0" width="28" height="185" rx="2" fill="url(#glass)" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M 0,185 A 14 14 0 0 0 28 185" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <ellipse cx="14" cy="0" rx="16" ry="4" fill="url(#glass)" stroke="#e0f2fe" stroke-width="1.5"/>
    <line x1="4" y1="10" x2="4" y2="180" stroke="#fff" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Tube 2 (Blue Chemical) -->
  <g transform="translate(150, 45)">
    <rect x="0" y="80" width="28" height="105" fill="#0284c7" opacity="0.85"/>
    <path d="M 0,185 A 14 14 0 0 0 28 185 Z" fill="#0284c7" opacity="0.85"/>
    <rect x="0" y="0" width="28" height="185" rx="2" fill="url(#glass)" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M 0,185 A 14 14 0 0 0 28 185" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <ellipse cx="14" cy="0" rx="16" ry="4" fill="url(#glass)" stroke="#e0f2fe" stroke-width="1.5"/>
    <line x1="4" y1="10" x2="4" y2="180" stroke="#fff" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Tube 3 (Green Chemical) -->
  <g transform="translate(210, 45)">
    <rect x="0" y="100" width="28" height="85" fill="#10b981" opacity="0.85"/>
    <path d="M 0,185 A 14 14 0 0 0 28 185 Z" fill="#10b981" opacity="0.85"/>
    <rect x="0" y="0" width="28" height="185" rx="2" fill="url(#glass)" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M 0,185 A 14 14 0 0 0 28 185" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <ellipse cx="14" cy="0" rx="16" ry="4" fill="url(#glass)" stroke="#e0f2fe" stroke-width="1.5"/>
    <line x1="4" y1="10" x2="4" y2="180" stroke="#fff" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Tube 4 (Amber/Yellow Chemical) -->
  <g transform="translate(270, 45)">
    <rect x="0" y="125" width="28" height="60" fill="#f59e0b" opacity="0.85"/>
    <path d="M 0,185 A 14 14 0 0 0 28 185 Z" fill="#f59e0b" opacity="0.85"/>
    <rect x="0" y="0" width="28" height="185" rx="2" fill="url(#glass)" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M 0,185 A 14 14 0 0 0 28 185" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <ellipse cx="14" cy="0" rx="16" ry="4" fill="url(#glass)" stroke="#e0f2fe" stroke-width="1.5"/>
    <line x1="4" y1="10" x2="4" y2="180" stroke="#fff" stroke-width="1.5" opacity="0.6"/>
  </g>

  <rect x="15" y="15" width="145" height="26" rx="6" fill="#0284c7" opacity="0.25"/>
  <text x="25" y="32" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">TABUNG REAKSI</text>
</svg>