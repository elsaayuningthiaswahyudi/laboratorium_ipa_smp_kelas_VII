<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b192e"/><stop offset="100%" stop-color="#030b17"/>
    </linearGradient>
    <linearGradient id="glassF" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="75%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg)"/>
  <ellipse cx="200" cy="270" rx="70" ry="12" fill="#000" opacity="0.5"/>

  <!-- Filter Paper Cone inside Funnel -->
  <polygon points="120,70 200,165 280,70" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <ellipse cx="200" cy="70" rx="80" ry="15" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Glass Cone -->
  <polygon points="110,65 194,175 194,260 206,260 206,175 290,65" fill="url(#glassF)" stroke="#38bdf8" stroke-width="2"/>
  
  <!-- Stem Bevel Cut -->
  <polygon points="194,250 206,260 194,260" fill="#38bdf8"/>

  <!-- Funnel Top Rim -->
  <ellipse cx="200" cy="65" rx="90" ry="18" fill="none" stroke="#e0f2fe" stroke-width="2.2"/>

  <!-- Reflection -->
  <path d="M 125,75 L 196,172 L 196,255" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>

  <rect x="15" y="15" width="130" height="26" rx="6" fill="#0284c7" opacity="0.25"/>
  <text x="25" y="32" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">CORONG KACA</text>
</svg>