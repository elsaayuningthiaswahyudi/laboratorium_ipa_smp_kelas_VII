<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b192e"/><stop offset="100%" stop-color="#030b17"/>
    </linearGradient>
    <linearGradient id="lens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="brassL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/><stop offset="50%" stop-color="#fde047"/><stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="handleW" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f"/><stop offset="50%" stop-color="#b45309"/><stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg)"/>
  <ellipse cx="200" cy="260" rx="120" ry="14" fill="#000" opacity="0.4"/>

  <!-- Handle (Pegangan Kayu/Logam) -->
  <path d="M 235,175 L 320,245 Q 330,255 320,265 Q 310,275 300,265 L 215,195 Z" fill="url(#handleW)" stroke="#d97706" stroke-width="1.5"/>
  <rect x="220" y="178" width="16" height="12" rx="2" fill="url(#brassL)" transform="rotate(40 220 178)"/>

  <!-- Outer Metal Rim Bezel -->
  <circle cx="160" cy="120" r="75" fill="none" stroke="url(#brassL)" stroke-width="12"/>
  <circle cx="160" cy="120" r="75" fill="none" stroke="#78350f" stroke-width="1.5"/>

  <!-- Convex Optical Lens -->
  <circle cx="160" cy="120" r="69" fill="url(#lens)"/>

  <!-- Magnified Grid / Microbe inside Lens -->
  <g opacity="0.5" stroke="#38bdf8" stroke-width="1">
    <circle cx="160" cy="120" r="25" fill="none"/>
    <line x1="160" y1="90" x2="160" y2="150"/>
    <line x1="130" y1="120" x2="190" y2="120"/>
  </g>
  <!-- Magnified Leaf Cell Sample -->
  <path d="M 145,110 Q 160,95 175,110 Q 190,125 175,135 Q 160,145 145,135 Z" fill="#22c55e" opacity="0.75"/>
  <line x1="145" y1="110" x2="175" y2="135" stroke="#15803d" stroke-width="1.5"/>

  <!-- Lens Arc Glare / Reflection -->
  <path d="M 115,85 A 60 60 0 0 1 205,75" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8"/>

  <rect x="15" y="15" width="170" height="26" rx="6" fill="#0284c7" opacity="0.25"/>
  <text x="25" y="32" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">KACA PEMBESAR (LUP)</text>
</svg>