<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b192e"/><stop offset="100%" stop-color="#030b17"/>
    </linearGradient>
    <linearGradient id="glassRod" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.5"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg)"/>
  <ellipse cx="200" cy="265" rx="110" ry="14" fill="#000" opacity="0.5"/>

  <!-- Beaker Contour in Background -->
  <path d="M 130,110 L 135,240 Q 200,255 265,240 L 270,110" fill="#0284c7" opacity="0.15" stroke="#38bdf8" stroke-width="2"/>
  <!-- Liquid in beaker -->
  <path d="M 133,160 L 135,240 Q 200,255 265,240 L 267,160 Q 200,170 133,160 Z" fill="#06b6d4" opacity="0.5"/>

  <!-- Glass Stirring Rod placed diagonally -->
  <g transform="rotate(-30 200 150)">
    <rect x="194" y="20" width="12" height="260" rx="6" fill="url(#glassRod)" stroke="#38bdf8" stroke-width="1.5"/>
    <ellipse cx="200" cy="24" rx="5" ry="3" fill="#ffffff"/>
    <ellipse cx="200" cy="276" rx="5" ry="3" fill="#ffffff"/>
    <!-- Glare Line -->
    <line x1="197" y1="28" x2="197" y2="270" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  </g>

  <rect x="15" y="15" width="160" height="26" rx="6" fill="#0284c7" opacity="0.25"/>
  <text x="25" y="32" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">BATANG PENGADUK</text>
</svg>