<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="highLightBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#fae8ff"/>
      <stop offset="100%" stop-color="#f0abfc"/>
    </radialGradient>
    <radialGradient id="bigNucleus" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="40%" stop-color="#9333ea"/>
      <stop offset="80%" stop-color="#581c87"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </radialGradient>
  </defs>
  <rect width="500" height="500" fill="url(#highLightBg)"/>

  <!-- Close-up of Main Plant Cell at 40x -->
  <!-- Thick Double Cell Wall (Primary & Middle Lamella) -->
  <rect x="40" y="40" width="420" height="420" rx="35" fill="#fdf4ff" stroke="#7e22ce" stroke-width="12"/>
  <rect x="48" y="48" width="404" height="404" rx="28" fill="#fae8ff" stroke="#a855f7" stroke-width="4"/>

  <!-- Plasma Membrane & Cytoplasm Rim -->
  <rect x="58" y="58" width="384" height="384" rx="22" fill="#f5d0fe" opacity="0.5"/>

  <!-- Giant Central Vacuole (occupies 80% of cell) -->
  <rect x="90" y="90" width="320" height="320" rx="40" fill="#ffffff" opacity="0.65" stroke="#e879f9" stroke-width="2" stroke-dasharray="8,6"/>
  <text x="220" y="260" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#c084fc" opacity="0.5">Vakuola Besar</text>

  <!-- Large Detailed Nucleus pushed to cell periphery -->
  <g transform="translate(160, 160)">
    <!-- Nuclear Envelope with pores -->
    <circle cx="0" cy="0" r="48" fill="url(#bigNucleus)" stroke="#3b0764" stroke-width="3"/>
    <!-- Nucleolus (Anak Inti) -->
    <circle cx="-10" cy="-8" r="14" fill="#1e1b4b"/>
    <!-- Chromatin Network Specks -->
    <circle cx="16" cy="12" r="4" fill="#4c1d95"/>
    <circle cx="12" cy="-18" r="5" fill="#4c1d95"/>
    <circle cx="-18" cy="18" r="4" fill="#4c1d95"/>
    <circle cx="-4" cy="22" r="3.5" fill="#4c1d95"/>
  </g>

  <!-- Cytoplasmic Granules -->
  <g fill="#9333ea" opacity="0.6">
    <circle cx="75" cy="120" r="3"/><circle cx="82" cy="160" r="3.5"/>
    <circle cx="70" cy="240" r="3"/><circle cx="78" cy="320" r="4"/>
    <circle cx="120" cy="75" r="3.5"/><circle cx="280" cy="72" r="3"/>
    <circle cx="360" cy="78" r="4"/><circle cx="425" cy="150" r="3"/>
    <circle cx="420" cy="280" r="3.5"/><circle cx="320" cy="425" r="3"/>
    <circle cx="180" cy="428" r="3.5"/><circle cx="110" cy="420" r="3"/>
  </g>

  <!-- Neighboring Cell Borders -->
  <line x1="40" y1="250" x2="-20" y2="250" stroke="#7e22ce" stroke-width="12"/>
  <line x1="460" y1="250" x2="520" y2="250" stroke="#7e22ce" stroke-width="12"/>
  <line x1="250" y1="40" x2="250" y2="-20" stroke="#7e22ce" stroke-width="12"/>
  <line x1="250" y1="460" x2="250" y2="520" stroke="#7e22ce" stroke-width="12"/>
</svg>