<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b192e"/><stop offset="100%" stop-color="#030b17"/>
    </linearGradient>
    <linearGradient id="glassE" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="25%" stop-color="#a855f7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="purpleLiquid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg)"/>
  <ellipse cx="200" cy="265" rx="100" ry="15" fill="#000" opacity="0.5"/>

  <!-- Liquid Body -->
  <path d="M 140,165 L 98,245 Q 200,265 302,245 L 260,165 Q 200,175 140,165 Z" fill="url(#purpleLiquid)"/>
  <ellipse cx="200" cy="165" rx="60" ry="8" fill="#c084fc" opacity="0.85"/>

  <!-- Reaction Bubbles -->
  <circle cx="170" cy="210" r="5" fill="#ffffff" opacity="0.6"/>
  <circle cx="230" cy="190" r="4" fill="#ffffff" opacity="0.6"/>
  <circle cx="195" cy="180" r="6" fill="#ffffff" opacity="0.7"/>
  <circle cx="215" cy="225" r="3" fill="#ffffff" opacity="0.5"/>

  <!-- Flask Glass Contour -->
  <path d="M 175,45 L 175,100 L 92,245 Q 200,268 308,245 L 225,100 L 225,45 Z" fill="url(#glassE)" stroke="#38bdf8" stroke-width="2.2"/>
  
  <!-- Rim -->
  <ellipse cx="200" cy="45" rx="27" ry="6" fill="none" stroke="#e0f2fe" stroke-width="2.2"/>

  <!-- Graduations -->
  <g stroke="#ffffff" stroke-width="1.8">
    <line x1="210" y1="180" x2="245" y2="180"/><text x="175" y="184" fill="#ffffff" font-size="11" font-weight="bold" font-family="sans-serif">200ml</text>
    <line x1="220" y1="205" x2="260" y2="205"/><text x="185" y="209" fill="#ffffff" font-size="11" font-weight="bold" font-family="sans-serif">100ml</text>
  </g>

  <!-- Specular Reflection -->
  <path d="M 180,50 L 180,98 L 105,235" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <rect x="15" y="15" width="155" height="26" rx="6" fill="#0284c7" opacity="0.25"/>
  <text x="25" y="32" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">LABU ERLENMEYER</text>
</svg>