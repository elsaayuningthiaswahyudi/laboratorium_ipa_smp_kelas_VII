<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b192e"/><stop offset="100%" stop-color="#030b17"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/><stop offset="50%" stop-color="#f1f5f9"/><stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="brass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/><stop offset="50%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="baseG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/><stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg)"/>
  <ellipse cx="200" cy="265" rx="150" ry="18" fill="#000" opacity="0.5"/>

  <!-- Base Casting -->
  <path d="M 30,245 L 60,225 L 340,225 L 370,245 L 360,260 L 40,260 Z" fill="url(#baseG)" stroke="#38bdf8" stroke-width="1.5"/>
  <ellipse cx="60" cy="250" rx="12" ry="6" fill="url(#brass)"/>
  <ellipse cx="340" cy="250" rx="12" ry="6" fill="url(#brass)"/>

  <!-- Central Fulcrum Pillar -->
  <rect x="130" y="130" width="28" height="100" rx="4" fill="url(#baseG)" stroke="#38bdf8" stroke-width="1.2"/>
  <circle cx="144" cy="145" r="7" fill="url(#brass)"/>

  <!-- Pan & Support Bow -->
  <path d="M 75,145 L 75,190 Q 75,200 90,200 L 135,145" fill="none" stroke="url(#metal)" stroke-width="4"/>
  <ellipse cx="75" cy="140" rx="45" ry="10" fill="url(#metal)" stroke="#cbd5e1" stroke-width="1.5"/>
  <ellipse cx="75" cy="138" rx="40" ry="8" fill="#e2e8f0"/>

  <!-- Triple Beams -->
  <!-- Back Beam (0-100g) -->
  <rect x="135" y="130" width="180" height="8" rx="2" fill="url(#metal)"/>
  <rect x="220" y="126" width="14" height="16" rx="2" fill="url(#brass)"/>

  <!-- Middle Beam (0-500g) -->
  <rect x="135" y="145" width="180" height="12" rx="2" fill="url(#metal)"/>
  <rect x="180" y="140" width="22" height="22" rx="3" fill="url(#brass)"/>

  <!-- Front Beam (0-10g) with notches -->
  <rect x="135" y="165" width="180" height="7" rx="2" fill="url(#metal)"/>
  <rect x="250" y="162" width="12" height="13" rx="2" fill="url(#brass)"/>

  <!-- Scale markings on beams -->
  <g stroke="#334155" stroke-width="1">
    <line x1="150" y1="165" x2="150" y2="172"/><line x1="170" y1="165" x2="170" y2="172"/><line x1="190" y1="165" x2="190" y2="172"/>
    <line x1="210" y1="165" x2="210" y2="172"/><line x1="230" y1="165" x2="230" y2="172"/><line x1="270" y1="165" x2="270" y2="172"/><line x1="290" y1="165" x2="290" y2="172"/>
  </g>

  <!-- Pointer Needle & Zero Index -->
  <polygon points="315,150 345,150 315,153" fill="#ef4444"/>
  <rect x="345" y="120" width="12" height="60" rx="2" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <line x1="340" y1="150" x2="355" y2="150" stroke="#22c55e" stroke-width="2"/>
  <text x="360" y="154" font-family="sans-serif" font-size="11" font-weight="bold" fill="#22c55e">0</text>

  <!-- Title Badge -->
  <rect x="15" y="15" width="140" height="26" rx="6" fill="#0284c7" opacity="0.25"/>
  <text x="25" y="32" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">NERACA OHAUS</text>
</svg>