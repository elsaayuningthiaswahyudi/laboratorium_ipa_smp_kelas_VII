<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b192e"/><stop offset="100%" stop-color="#030b17"/>
    </linearGradient>
    <linearGradient id="glassT" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="redLiquid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/><stop offset="50%" stop-color="#ef4444"/><stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg)"/>
  
  <!-- Shadow -->
  <ellipse cx="200" cy="270" rx="60" ry="10" fill="#000" opacity="0.5"/>

  <!-- Thermometer Stem -->
  <rect x="186" y="30" width="28" height="205" rx="14" fill="url(#glassT)" stroke="#38bdf8" stroke-width="1.8"/>

  <!-- Thermometer Bulb -->
  <circle cx="200" cy="245" r="22" fill="url(#redLiquid)" stroke="#38bdf8" stroke-width="1.8"/>
  <circle cx="200" cy="245" r="25" fill="url(#glassT)" opacity="0.6"/>

  <!-- Capillary Column -->
  <rect x="197" y="40" width="6" height="190" rx="3" fill="#ffffff" opacity="0.25"/>
  <rect x="197" y="100" width="6" height="130" rx="3" fill="url(#redLiquid)"/>

  <!-- Degree Markings -->
  <g stroke="#ffffff" stroke-width="1.5">
    <line x1="170" y1="50" x2="186" y2="50"/><text x="135" y="54" fill="#ffffff" font-size="12" font-weight="bold" font-family="sans-serif">100&#176;C</text>
    <line x1="176" y1="65" x2="186" y2="65" stroke-width="1" opacity="0.7"/>
    <line x1="176" y1="80" x2="186" y2="80" stroke-width="1" opacity="0.7"/>
    <line x1="170" y1="95" x2="186" y2="95"/><text x="142" y="99" fill="#ffffff" font-size="12" font-weight="bold" font-family="sans-serif">75&#176;C</text>
    <line x1="176" y1="110" x2="186" y2="110" stroke-width="1" opacity="0.7"/>
    <line x1="176" y1="125" x2="186" y2="125" stroke-width="1" opacity="0.7"/>
    <line x1="170" y1="140" x2="186" y2="140"/><text x="142" y="144" fill="#ffffff" font-size="12" font-weight="bold" font-family="sans-serif">50&#176;C</text>
    <line x1="176" y1="155" x2="186" y2="155" stroke-width="1" opacity="0.7"/>
    <line x1="176" y1="170" x2="186" y2="170" stroke-width="1" opacity="0.7"/>
    <line x1="170" y1="185" x2="186" y2="185"/><text x="142" y="189" fill="#ffffff" font-size="12" font-weight="bold" font-family="sans-serif">25&#176;C</text>
    <line x1="170" y1="215" x2="186" y2="215"/><text x="148" y="219" fill="#38bdf8" font-size="12" font-weight="bold" font-family="sans-serif">0&#176;C</text>
  </g>

  <!-- Right side scale (Fahrenheit) -->
  <g stroke="#94a3b8" stroke-width="1">
    <line x1="214" y1="50" x2="226" y2="50"/><text x="232" y="54" fill="#94a3b8" font-size="11" font-family="sans-serif">212&#176;F</text>
    <line x1="214" y1="95" x2="222" y2="95"/>
    <line x1="214" y1="140" x2="226" y2="140"/><text x="232" y="144" fill="#94a3b8" font-size="11" font-family="sans-serif">122&#176;F</text>
    <line x1="214" y1="185" x2="222" y2="185"/>
    <line x1="214" y1="215" x2="226" y2="215"/><text x="232" y="219" fill="#94a3b8" font-size="11" font-family="sans-serif">32&#176;F</text>
  </g>

  <!-- Highlights -->
  <path d="M 190,38 L 190,225" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <ellipse cx="193" cy="238" rx="6" ry="10" fill="#ffffff" opacity="0.6" transform="rotate(-30 193 238)"/>
  
  <rect x="15" y="15" width="145" height="26" rx="6" fill="#0284c7" opacity="0.25"/>
  <text x="25" y="32" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">TERMOMETER LAB</text>
</svg>