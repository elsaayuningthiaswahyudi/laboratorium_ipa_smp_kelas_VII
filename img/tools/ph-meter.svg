<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="phBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b192e"/><stop offset="100%" stop-color="#030b17"/>
    </linearGradient>
    <linearGradient id="meterBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/><stop offset="50%" stop-color="#334155"/><stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="probeGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#phBg)"/>

  <!-- Shadow -->
  <ellipse cx="200" cy="275" rx="130" ry="12" fill="#000000" opacity="0.45"/>

  <!-- Digital pH Meter Body -->
  <rect x="80" y="55" width="120" height="195" rx="14" fill="url(#meterBody)" stroke="#38bdf8" stroke-width="2"/>
  
  <!-- Digital LCD Screen -->
  <rect x="95" y="75" width="90" height="55" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <rect x="98" y="78" width="84" height="49" rx="4" fill="#0284c7" opacity="0.15"/>
  <text x="143" y="112" font-family="monospace" font-size="28" font-weight="900" fill="#38bdf8" text-anchor="middle">7.00</text>
  <text x="175" y="92" font-family="sans-serif" font-size="10" font-weight="bold" fill="#94a3b8">pH</text>
  <text x="110" y="122" font-family="sans-serif" font-size="9" fill="#22c55e">25.0°C</text>

  <!-- Keypad Buttons -->
  <circle cx="115" cy="160" r="12" fill="#ef4444" stroke="#ffffff" stroke-width="1.2"/>
  <text x="115" y="163" font-family="sans-serif" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">PWR</text>
  <circle cx="165" cy="160" r="12" fill="#3b82f6" stroke="#ffffff" stroke-width="1.2"/>
  <text x="165" y="163" font-family="sans-serif" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">CAL</text>
  <circle cx="140" cy="195" r="12" fill="#10b981" stroke="#ffffff" stroke-width="1.2"/>
  <text x="140" y="198" font-family="sans-serif" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">MODE</text>

  <!-- Probe Cable -->
  <path d="M140 55 C140 20, 260 20, 260 60" fill="none" stroke="#0f172a" stroke-width="8" stroke-linecap="round"/>
  <path d="M140 55 C140 20, 260 20, 260 60" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>

  <!-- pH Electrode Probe -->
  <rect x="250" y="60" width="20" height="60" rx="4" fill="#334155" stroke="#475569" stroke-width="1.5"/>
  <rect x="254" y="120" width="12" height="110" rx="2" fill="url(#probeGlass)" stroke="#38bdf8" stroke-width="1.2"/>
  <circle cx="260" cy="235" r="9" fill="#38bdf8" opacity="0.6" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Beaker with Solution -->
  <path d="M230 180 L230 260 Q230 268 238 268 L282 268 Q290 268 290 260 L290 180" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <path d="M232 205 L232 260 Q232 266 238 266 L282 266 Q288 266 288 260 L288 205 Z" fill="#0284c7" opacity="0.35"/>

  <!-- Title Badge -->
  <rect x="15" y="15" width="130" height="26" rx="6" fill="#0284c7" opacity="0.25"/>
  <text x="25" y="32" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">pH METER DIGITAL</text>
</svg>
