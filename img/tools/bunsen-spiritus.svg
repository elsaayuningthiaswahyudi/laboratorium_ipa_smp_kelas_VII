<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b192e"/><stop offset="100%" stop-color="#030b17"/>
    </linearGradient>
    <linearGradient id="flameInner" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/><stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="flameOuter" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/><stop offset="60%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg)"/>
  <ellipse cx="200" cy="270" rx="95" ry="14" fill="#000" opacity="0.6"/>

  <!-- Spiritus Fluid inside glass bulb -->
  <ellipse cx="200" cy="205" rx="65" ry="45" fill="#a855f7" opacity="0.65"/>

  <!-- Glass Reservoir Bulb -->
  <ellipse cx="200" cy="200" rx="70" ry="50" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
  <!-- Base Stand -->
  <path d="M 155,245 L 140,260 L 260,260 L 245,245 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Metal Collar & Wick Holder -->
  <rect x="185" y="135" width="30" height="20" rx="2" fill="#d97706" stroke="#b45309" stroke-width="1.5"/>
  <!-- Wick (Sumbu) -->
  <rect x="194" y="120" width="12" height="18" fill="#e2e8f0" stroke="#94a3b8"/>

  <!-- Outer Flame Glow -->
  <ellipse cx="200" cy="80" rx="30" ry="50" fill="#f59e0b" opacity="0.2" filter="blur(8px)"/>
  <!-- Outer Flame Cone -->
  <path d="M 180,120 Q 155,80 200,30 Q 245,80 220,120 Z" fill="url(#flameOuter)" opacity="0.9"/>
  <!-- Inner Blue Flame Cone -->
  <path d="M 190,120 Q 178,95 200,60 Q 222,95 210,120 Z" fill="url(#flameInner)"/>

  <!-- Glare -->
  <ellipse cx="170" cy="185" rx="15" ry="25" fill="#ffffff" opacity="0.4" transform="rotate(-30 170 185)"/>

  <rect x="15" y="15" width="165" height="26" rx="6" fill="#0284c7" opacity="0.25"/>
  <text x="25" y="32" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">PEMBAKAR SPIRITUS</text>
</svg>