<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b192e"/><stop offset="100%" stop-color="#030b17"/>
    </linearGradient>
    <linearGradient id="iron" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/><stop offset="50%" stop-color="#64748b"/><stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg)"/>
  <ellipse cx="200" cy="270" rx="140" ry="14" fill="#000" opacity="0.5"/>

  <!-- Back Leg -->
  <line x1="200" y1="80" x2="200" y2="245" stroke="url(#iron)" stroke-width="10" stroke-linecap="round"/>
  <!-- Left Leg -->
  <line x1="125" y1="80" x2="70" y2="260" stroke="url(#iron)" stroke-width="12" stroke-linecap="round"/>
  <!-- Right Leg -->
  <line x1="275" y1="80" x2="330" y2="260" stroke="url(#iron)" stroke-width="12" stroke-linecap="round"/>

  <!-- Top Circular Ring Platform -->
  <ellipse cx="200" cy="80" rx="85" ry="24" fill="#0f172a" stroke="url(#iron)" stroke-width="14"/>
  <ellipse cx="200" cy="80" rx="72" ry="18" fill="none" stroke="#38bdf8" stroke-width="2"/>

  <rect x="15" y="15" width="100" height="26" rx="6" fill="#0284c7" opacity="0.25"/>
  <text x="25" y="32" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">KAKI TIGA</text>
</svg>