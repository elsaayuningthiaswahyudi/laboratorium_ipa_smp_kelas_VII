<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b192e"/><stop offset="100%" stop-color="#030b17"/>
    </linearGradient>
    <linearGradient id="agar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.7"/><stop offset="100%" stop-color="#facc15" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg)"/>
  <ellipse cx="200" cy="245" rx="140" ry="30" fill="#000" opacity="0.5"/>

  <!-- Petri Bottom Dish -->
  <ellipse cx="200" cy="180" rx="130" ry="50" fill="url(#agar)" stroke="#38bdf8" stroke-width="2"/>
  <path d="M 70,180 L 70,195 Q 200,250 330,195 L 330,180" fill="#fef08a" opacity="0.3" stroke="#38bdf8" stroke-width="2"/>

  <!-- Bacterial Colonies on Agar -->
  <!-- Colony 1 Red -->
  <circle cx="150" cy="170" r="10" fill="#ef4444" opacity="0.9"/>
  <circle cx="165" cy="160" r="6" fill="#ef4444" opacity="0.8"/>
  <circle cx="140" cy="185" r="7" fill="#ef4444" opacity="0.8"/>

  <!-- Colony 2 Blue/Cyan -->
  <circle cx="240" cy="165" r="12" fill="#06b6d4" opacity="0.9"/>
  <circle cx="260" cy="175" r="8" fill="#06b6d4" opacity="0.85"/>
  <circle cx="225" cy="180" r="5" fill="#06b6d4" opacity="0.75"/>

  <!-- Colony 3 Green -->
  <circle cx="190" cy="200" r="9" fill="#22c55e" opacity="0.9"/>
  <circle cx="210" cy="205" r="7" fill="#22c55e" opacity="0.8"/>

  <!-- Streaking lines -->
  <path d="M 130,160 Q 150,145 170,165 T 200,160" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.7"/>

  <!-- Petri Dish Lid (Slightly shifted) -->
  <ellipse cx="200" cy="155" rx="136" ry="52" fill="none" stroke="#e0f2fe" stroke-width="2.5" opacity="0.7"/>
  <path d="M 64,155 L 64,168 Q 200,225 336,168 L 336,155" fill="none" stroke="#e0f2fe" stroke-width="2" opacity="0.7"/>

  <!-- Highlight Reflections -->
  <path d="M 90,150 Q 200,195 310,150" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5"/>

  <rect x="15" y="15" width="130" height="26" rx="6" fill="#0284c7" opacity="0.25"/>
  <text x="25" y="32" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">CAWAN PETRI</text>
</svg>