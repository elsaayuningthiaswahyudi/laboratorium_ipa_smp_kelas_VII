<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- GHS Red Diamond Border -->
  <polygon points="100,12 188,100 100,188 12,100" fill="#ffffff" stroke="#e11d48" stroke-width="14" stroke-linejoin="miter"/>

  <!-- Flame Over Circle (Oxidizer 'O' with Flames) -->
  <g fill="#000000" transform="translate(100, 105)">
    <!-- Flames Rising from top of circle -->
    <path d="M 0,-52 
             C 12,-38 26,-20 24,0 
             C 18,-10 10,-14 0,-12 
             C -10,-14 -18,-10 -24,0 
             C -26,-20 -12,-38 0,-52 Z"/>
    
    <path d="M -12,-32 C -22,-20 -20,-2 -15,10 C -22,2 -24,-12 -12,-32 Z"/>
    <path d="M 12,-32 C 22,-20 20,-2 15,10 C 22,2 24,-12 12,-32 Z"/>

    <!-- Heavy Circle / Sphere Ring 'O' -->
    <circle cx="0" cy="18" r="24"/>
    <circle cx="0" cy="18" r="14" fill="#ffffff"/>
  </g>
</svg>