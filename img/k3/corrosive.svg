<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- GHS Red Diamond Border -->
  <polygon points="100,12 188,100 100,188 12,100" fill="#ffffff" stroke="#e11d48" stroke-width="14" stroke-linejoin="miter"/>

  <!-- Corrosive Pictogram (Black) -->
  <g fill="#000000" transform="translate(100, 100)">
    <!-- Left Pouring Tube (Pouring on bar) -->
    <g transform="translate(-25, -28) rotate(45)">
      <rect x="-7" y="-18" width="14" height="36" rx="4" fill="none" stroke="#000000" stroke-width="3"/>
      <line x1="-7" y1="8" x2="7" y2="8" stroke="#000000" stroke-width="3"/>
    </g>
    <!-- Liquid stream 1 -->
    <path d="M -30,-8 Q -33,10 -35,22" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="-35" cy="25" r="2.5"/>

    <!-- Metal Plate with Notch from Acid -->
    <rect x="-52" y="26" width="34" height="12"/>
    <path d="M -42,26 Q -35,36 -28,26 Z" fill="#ffffff"/>

    <!-- Right Pouring Tube (Pouring on hand) -->
    <g transform="translate(25, -28) rotate(-45)">
      <rect x="-7" y="-18" width="14" height="36" rx="4" fill="none" stroke="#000000" stroke-width="3"/>
      <line x1="-7" y1="8" x2="7" y2="8" stroke="#000000" stroke-width="3"/>
    </g>
    <!-- Liquid stream 2 -->
    <path d="M 30,-8 Q 33,10 33,18" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="33" cy="21" r="2.5"/>

    <!-- Human Hand with Corrosion Hole -->
    <path d="M 6,38 L 15,28 L 22,28 C 24,24 28,22 32,24 C 36,22 40,24 45,28 L 50,32 L 50,42 L 6,42 Z"/>
    <circle cx="33" cy="28" r="5" fill="#ffffff"/>
  </g>
</svg>