<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <rect width="500" height="500" fill="#fdf2f8"/>
  <defs>
    <linearGradient id="muscleFiber10x" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <pattern id="striations10x" width="8" height="500" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="500" stroke="#991b1b" stroke-width="3" opacity="0.65"/>
      <line x1="4" y1="0" x2="4" y2="500" stroke="#fca5a5" stroke-width="3" opacity="0.6"/>
    </pattern>
    <radialGradient id="muscleNuc10x" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="80%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
  </defs>

  <!-- 3 Distinct Thick Skeletal Muscle Fibers (10x View) -->
  <!-- Fiber 1 -->
  <g transform="translate(0, 40)">
    <rect x="0" y="0" width="500" height="120" fill="url(#muscleFiber10x)"/>
    <rect x="0" y="0" width="500" height="120" fill="url(#striations10x)"/>
    <!-- Peripheral Nuclei -->
    <ellipse cx="110" cy="8" rx="20" ry="7" fill="url(#muscleNuc10x)"/>
    <ellipse cx="320" cy="112" rx="22" ry="7.5" fill="url(#muscleNuc10x)"/>
  </g>

  <!-- Fiber 2 -->
  <g transform="translate(0, 190)">
    <rect x="0" y="0" width="500" height="120" fill="url(#muscleFiber10x)"/>
    <rect x="0" y="0" width="500" height="120" fill="url(#striations10x)"/>
    <!-- Peripheral Nuclei -->
    <ellipse cx="180" cy="112" rx="21" ry="7.5" fill="url(#muscleNuc10x)"/>
    <ellipse cx="410" cy="8" rx="20" ry="7" fill="url(#muscleNuc10x)"/>
  </g>

  <!-- Fiber 3 -->
  <g transform="translate(0, 340)">
    <rect x="0" y="0" width="500" height="120" fill="url(#muscleFiber10x)"/>
    <rect x="0" y="0" width="500" height="120" fill="url(#striations10x)"/>
    <!-- Peripheral Nuclei -->
    <ellipse cx="80" cy="8" rx="20" ry="7" fill="url(#muscleNuc10x)"/>
    <ellipse cx="280" cy="112" rx="22" ry="7.5" fill="url(#muscleNuc10x)"/>
  </g>

  <!-- Intercalated Endomysium Spacing -->
  <rect x="0" y="160" width="500" height="30" fill="#fee2e2" opacity="0.6"/>
  <rect x="0" y="310" width="500" height="30" fill="#fee2e2" opacity="0.6"/>
</svg>
