<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="cheekBg4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="70%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </radialGradient>
  </defs>
  <rect width="500" height="500" fill="url(#cheekBg4)"/>

  <!-- Scattered human squamous epithelial cell clumps (4x overview) -->
  <g stroke="#2563eb" stroke-width="1.2" fill="#93c5fd" opacity="0.6">
    <!-- Cell 1 -->
    <path d="M 60,80 Q 90,60 120,75 Q 140,110 115,130 Q 80,140 65,115 Z"/><circle cx="95" cy="100" r="3.5" fill="#1e3a8a"/>
    <!-- Cell 2 -->
    <path d="M 110,120 Q 150,105 170,130 Q 165,165 130,170 Q 100,155 110,120 Z"/><circle cx="140" cy="142" r="3.5" fill="#1e3a8a"/>
    <!-- Cell 3 -->
    <path d="M 70,140 Q 100,135 110,165 Q 90,195 65,185 Q 50,160 70,140 Z"/><circle cx="85" cy="165" r="3" fill="#1e3a8a"/>

    <!-- Clump Center -->
    <path d="M 220,200 Q 280,180 320,220 Q 340,280 290,310 Q 220,320 200,270 Q 190,220 220,200 Z"/><circle cx="265" cy="255" r="4.5" fill="#1e3a8a"/>
    <path d="M 290,190 Q 350,170 380,210 Q 390,260 345,280 Q 300,260 290,190 Z"/><circle cx="340" cy="225" r="4" fill="#1e3a8a"/>
    <path d="M 170,250 Q 220,230 240,270 Q 230,320 180,330 Q 140,300 170,250 Z"/><circle cx="195" cy="285" r="4" fill="#1e3a8a"/>

    <!-- Clump Bottom -->
    <path d="M 360,340 Q 410,320 440,355 Q 430,410 385,420 Q 340,395 360,340 Z"/><circle cx="395" cy="375" r="3.5" fill="#1e3a8a"/>
    <path d="M 90,360 Q 140,340 170,370 Q 160,420 110,430 Q 70,400 90,360 Z"/><circle cx="125" cy="390" r="3.5" fill="#1e3a8a"/>
  </g>

  <!-- Bacteria / Rods in Background Specimen -->
  <g fill="#1e40af" opacity="0.4">
    <circle cx="210" cy="120" r="1.5"/><circle cx="218" cy="124" r="1.5"/><circle cx="310" cy="370" r="1.5"/>
    <circle cx="150" cy="210" r="1.5"/><circle cx="410" cy="200" r="1.5"/><circle cx="280" cy="110" r="1.5"/>
  </g>
</svg>