<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <rect width="500" height="500" fill="#fdf2f8"/>
  <defs>
    <radialGradient id="rbcGrad40x" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="45%" stop-color="#ef4444"/>
      <stop offset="85%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </radialGradient>
    <radialGradient id="rbcDip40x" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fee2e2"/>
      <stop offset="60%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </radialGradient>
    <radialGradient id="wbcGrad40x" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="90%" stop-color="#6b21a8"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </radialGradient>
    <radialGradient id="wbcNuc40x" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#581c87"/>
      <stop offset="70%" stop-color="#2e1065"/>
      <stop offset="100%" stop-color="#0f051d"/>
    </radialGradient>
  </defs>

  <!-- Large Detailed Red Blood Cells (Eritrosit Bikonkaf Tanpa Inti) -->
  <g transform="translate(110, 130)">
    <circle cx="0" cy="0" r="62" fill="url(#rbcGrad40x)" filter="drop-shadow(0 4px 10px rgba(185, 28, 28, 0.4))"/>
    <ellipse cx="0" cy="0" rx="30" ry="26" fill="url(#rbcDip40x)"/>
  </g>

  <g transform="translate(390, 110)">
    <circle cx="0" cy="0" r="58" fill="url(#rbcGrad40x)" filter="drop-shadow(0 4px 10px rgba(185, 28, 28, 0.4))"/>
    <ellipse cx="0" cy="0" rx="28" ry="24" fill="url(#rbcDip40x)"/>
  </g>

  <g transform="translate(90, 370)">
    <circle cx="0" cy="0" r="65" fill="url(#rbcGrad40x)" filter="drop-shadow(0 4px 10px rgba(185, 28, 28, 0.4))"/>
    <ellipse cx="0" cy="0" rx="32" ry="28" fill="url(#rbcDip40x)"/>
  </g>

  <g transform="translate(410, 380)">
    <circle cx="0" cy="0" r="60" fill="url(#rbcGrad40x)" filter="drop-shadow(0 4px 10px rgba(185, 28, 28, 0.4))"/>
    <ellipse cx="0" cy="0" rx="30" ry="25" fill="url(#rbcDip40x)"/>
  </g>

  <!-- Side-view Erythrocyte showing classic dumb-bell / biconcave profile -->
  <g transform="translate(60, 240) rotate(-35)">
    <path d="M -45,-15 C -45,-25 45,-25 45,-15 C 30,-5 30,5 45,15 C 45,25 -45,25 -45,15 C -30,5 -30,-5 -45,-15 Z" 
      fill="url(#rbcGrad40x)" stroke="#7f1d1d" stroke-width="2"/>
  </g>

  <!-- Massive Center White Blood Cell (Neutrofil Segmen dengan Granula) -->
  <g transform="translate(250, 260)">
    <!-- WBC Cell Membrane & Cytoplasm -->
    <circle cx="0" cy="0" r="88" fill="url(#wbcGrad40x)" stroke="#4c1d95" stroke-width="4" filter="drop-shadow(0 6px 16px rgba(107, 33, 168, 0.35))"/>

    <!-- Cytoplasmic Granules -->
    <g fill="#4c1d95" opacity="0.4">
      <circle cx="-50" cy="-30" r="2.5"/><circle cx="-60" cy="20" r="3"/><circle cx="-25" cy="-60" r="3"/>
      <circle cx="45" cy="-45" r="3"/><circle cx="65" cy="15" r="2.5"/><circle cx="35" cy="55" r="3"/>
      <circle cx="-35" cy="55" r="3"/><circle cx="0" cy="-65" r="2.5"/><circle cx="60" cy="-20" r="3"/>
    </g>

    <!-- Multi-lobed Characteristic Nucleus (3 Lobus Terhubung Benang Kromatin) -->
    <!-- Lobe 1 (Top Left) -->
    <ellipse cx="-28" cy="-26" rx="24" ry="20" fill="url(#wbcNuc40x)"/>
    <!-- Lobe 2 (Right) -->
    <ellipse cx="30" cy="-10" rx="22" ry="26" fill="url(#wbcNuc40x)"/>
    <!-- Lobe 3 (Bottom Left) -->
    <ellipse cx="-15" cy="32" rx="25" ry="20" fill="url(#wbcNuc40x)"/>

    <!-- Connecting Chromatin Strands -->
    <path d="M -15,-10 Q 10,-25 20,-10" stroke="#0f051d" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M 20,5 Q 15,28 -5,28" stroke="#0f051d" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M -25,-10 Q -30,15 -18,22" stroke="#0f051d" stroke-width="6" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Platelet Clusters (Trombosit) -->
  <g transform="translate(300, 110)">
    <polygon points="-8,-4 0,-10 8,-4 6,6 -4,8" fill="#9333ea" stroke="#581c87" stroke-width="1.5"/>
    <circle cx="12" cy="8" r="5" fill="#9333ea"/>
    <circle cx="-10" cy="12" r="4.5" fill="#9333ea"/>
  </g>
</svg>
