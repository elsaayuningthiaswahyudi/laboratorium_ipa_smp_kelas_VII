    <ellipse cx="60" cy="165" rx="7" ry="4"/><ellipse cx="210" cy="210" rx="7" ry="4"/><ellipse cx="380" cy="168" rx="7" ry="4"/>
    <ellipse cx="150" cy="230" rx="7" ry="4"/><ellipse cx="320" cy="275" rx="7" ry="4"/><ellipse cx="440" cy="232" rx="7" ry="4"/>
    <ellipse cx="90" cy="295" rx="7" ry="4"/><ellipse cx="250" cy="340" rx="7" ry="4"/><ellipse cx="400" cy="298" rx="7" ry="4"/>
